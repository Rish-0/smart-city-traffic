version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_city_traffic.db
      - SECRET_KEY=${SECRET_KEY:-smart-city-traffic-super-secret-key-2024}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DEBUG=false
    volumes:
      - ./Dataset:/app/Dataset:ro
      - backend_data:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
